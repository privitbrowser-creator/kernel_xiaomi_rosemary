name: Build NetHunter Kernel - Rosemary

on:
  workflow_dispatch:
    inputs:
      BUILD_TITLE:
        description: 'اسم البناء (اختياري)'
        required: false
        default: 'NetHunter-Rosemary'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: R
          fetch-depth: 1

      - name: 🛠️ Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git gcc g++ make bc bison flex \
            libssl-dev libelf-dev libc6-dev \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3 python3-pip \
            zip unzip curl wget \
            cpio kmod

      - name: 🔧 Clone Clang Toolchain
        run: |
          git clone https://github.com/rama982/clang --depth=1 /home/runner/clang-llvm

      - name: 📦 Clone AnyKernel3
        run: |
          git clone https://github.com/rama982/AnyKernel3 -b rosemary /home/runner/AnyKernel

      - name: 🔰 Apply NetHunter Kernel Config
        run: |
          CONFIG_FILE="arch/arm64/configs/rosemary_defconfig"

          set_config() {
            ./scripts/config --file $CONFIG_FILE --enable $1 2>/dev/null || \
            echo "$1=y" >> $CONFIG_FILE
          }

          set_module() {
            ./scripts/config --file $CONFIG_FILE --module $1 2>/dev/null || \
            echo "$1=m" >> $CONFIG_FILE
          }

          # WiFi Monitor Mode & Packet Injection
          set_config CONFIG_CFG80211
          set_config CONFIG_CFG80211_WEXT
          set_config CONFIG_MAC80211
          set_config CONFIG_MAC80211_MESH
          set_config CONFIG_MAC80211_RC_MINSTREL
          set_config CONFIG_MAC80211_RC_MINSTREL_HT
          set_config CONFIG_MAC80211_RC_DEFAULT_MINSTREL

          # USB WiFi Drivers
          set_config CONFIG_USB_NET_DRIVERS
          set_config CONFIG_USB_NET_RNDIS_WLAN
          set_module CONFIG_ATH9K_HTC
          set_module CONFIG_ATH6KL_USB
          set_module CONFIG_RT2800USB
          set_config CONFIG_RT2800USB_RT33XX
          set_config CONFIG_RT2800USB_RT35XX
          set_config CONFIG_RT2800USB_RT53XX
          set_config CONFIG_RT2800USB_RT55XX
          set_config CONFIG_RT2800USB_UNKNOWN
          set_module CONFIG_RT2500USB
          set_module CONFIG_RT73USB
          set_module CONFIG_ZD1211RW
          set_module CONFIG_CARL9170
          set_module CONFIG_P54_USB
          set_module CONFIG_RTL8XXXU
          set_config CONFIG_RTL8XXXU_UNTESTED
          set_module CONFIG_RTL8192CU

          # USB HID Gadget
          set_config CONFIG_USB_GADGET
          set_config CONFIG_USB_CONFIGFS
          set_config CONFIG_USB_CONFIGFS_F_HID
          set_config CONFIG_USB_CONFIGFS_F_SERIAL
          set_config CONFIG_USB_CONFIGFS_F_ACM
          set_config CONFIG_USB_CONFIGFS_RNDIS
          set_config CONFIG_USB_CONFIGFS_NCM
          set_config CONFIG_USB_CONFIGFS_ECM
          set_config CONFIG_USB_CONFIGFS_F_FS
          set_config CONFIG_USB_G_HID
          set_config CONFIG_HID
          set_config CONFIG_USB_HID
          set_config CONFIG_HID_GENERIC

          # USB Network
          set_config CONFIG_USB_NET_CDCETHER
          set_config CONFIG_USB_NET_CDC_NCM
          set_config CONFIG_USB_NET_RNDIS_HOST
          set_module CONFIG_USB_NET_HUAWEI_CDC_NCM
          set_module CONFIG_USB_NET_CDC_MBIM

          # Bluetooth
          set_config CONFIG_BT
          set_module CONFIG_BT_HCIBTUSB
          set_config CONFIG_BT_HCIBTUSB_BCM
          set_config CONFIG_BT_HCIBTUSB_RTL
          set_config CONFIG_BT_RFCOMM
          set_config CONFIG_BT_RFCOMM_TTY
          set_config CONFIG_BT_BNEP
          set_config CONFIG_BT_HIDP
          set_config CONFIG_BT_LE

          # Netfilter / iptables
          set_config CONFIG_PACKET
          set_config CONFIG_PACKET_DIAG
          set_config CONFIG_NET_KEY
          set_config CONFIG_IP_ADVANCED_ROUTER
          set_config CONFIG_IP_MULTIPLE_TABLES
          set_config CONFIG_NETFILTER
          set_config CONFIG_NETFILTER_ADVANCED
          set_config CONFIG_NF_CONNTRACK
          set_config CONFIG_NF_CONNTRACK_EVENTS
          set_config CONFIG_NETFILTER_NETLINK
          set_config CONFIG_NETFILTER_NETLINK_QUEUE
          set_config CONFIG_IP_NF_IPTABLES
          set_config CONFIG_IP_NF_FILTER
          set_config CONFIG_IP_NF_NAT
          set_config CONFIG_IP_NF_MANGLE
          set_config CONFIG_IP_NF_TARGET_MASQUERADE
          set_config CONFIG_IP6_NF_IPTABLES
          set_config CONFIG_IP6_NF_FILTER
          set_config CONFIG_IP6_NF_MANGLE
          set_config CONFIG_IP6_NF_NAT

          # TUN/TAP
          set_config CONFIG_TUN

          # USB Serial
          set_config CONFIG_USB_SERIAL
          set_config CONFIG_USB_SERIAL_GENERIC
          set_module CONFIG_USB_SERIAL_CP210X
          set_module CONFIG_USB_SERIAL_FTDI_SIO
          set_module CONFIG_USB_SERIAL_PL2303
          set_module CONFIG_USB_SERIAL_CH341
          set_module CONFIG_USB_ACM

          # CAN Bus
          set_config CONFIG_CAN
          set_config CONFIG_CAN_RAW
          set_config CONFIG_CAN_BCM
          set_config CONFIG_CAN_GW
          set_config CONFIG_CAN_VCAN

          # NFS / CIFS
          set_config CONFIG_NFS_FS
          set_config CONFIG_NFS_V4
          set_module CONFIG_CIFS

          echo "✅ NetHunter config applied!"

      - name: 🏗️ Build Kernel
        run: |
          export PATH="/home/runner/clang-llvm/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export OUTDIR=/home/runner/out
          mkdir -p $OUTDIR

          echo "-NetHunter-Rosemary" > localversion

          make O=$OUTDIR \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            NM=llvm-nm \
            AR=llvm-ar \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            rosemary_defconfig

          make -j$(nproc) O=$OUTDIR \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            NM=llvm-nm \
            AR=llvm-ar \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            2>&1 | tee /home/runner/build.log

          if [ ! -f "/home/runner/out/arch/arm64/boot/Image.gz" ]; then
            echo "❌ BUILD FAILED - Image.gz not found!"
            tail -50 /home/runner/build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"

      - name: 📦 Package with AnyKernel3
        run: |
          DATE=$(date "+%Y%m%d-%H%M")
          ZIPNAME="NetHunter-Rosemary-${DATE}.zip"

          cp /home/runner/out/arch/arm64/boot/Image.gz /home/runner/AnyKernel/
          cd /home/runner/AnyKernel

          zip -r9 "$ZIPNAME" ./* \
            --exclude=".git/*" \
            --exclude="*.zip"

          echo "✅ ZIP created: $ZIPNAME"
          ls -lh /home/runner/AnyKernel/*.zip

      - name: 🚀 Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Rosemary-Kernel
          path: /home/runner/AnyKernel/NetHunter-Rosemary-*.zip
          retention-days: 30

      - name: 📋 Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: /home/runner/build.log
          retention-days: 7
